version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-taxi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taxi_password}
      POSTGRES_DB: ${DB_NAME:-taxi_db}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
